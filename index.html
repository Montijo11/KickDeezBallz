<style>
  html { scroll-behavior: smooth; }
  body { background:#101C2E; color:#fff; font-family:'Inter',sans-serif; overflow-x:hidden; }
  .hero { position:relative; overflow:hidden; background:linear-gradient(180deg,#001534 0%,#001534 78%,#101C2E 100%); }
  .glow { position:absolute; left:50%; top:45%; width:460px; height:460px; margin:-230px 0 0 -230px;
    background:radial-gradient(circle,rgba(228,68,12,.45),rgba(228,68,12,0) 65%); animation:pulse 4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.15)} }
  .streak { position:absolute; left:0; height:3px; width:150px; opacity:0;
    background:linear-gradient(90deg,transparent,#E4440C,transparent); animation:streak 3s linear infinite; }
  @keyframes streak { 0%{transform:translateX(-200px) rotate(-20deg);opacity:0} 20%{opacity:.9} 100%{transform:translateX(560px) rotate(-20deg);opacity:0} }
  .mainlogo { animation:float 4s ease-in-out infinite; filter:drop-shadow(0 0 30px rgba(228,68,12,.35)); }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .spark { position:absolute; bottom:-10px; width:5px; height:5px; border-radius:50%; background:#E4440C; opacity:0; animation:spark 4s ease-in infinite; }
  @keyframes spark { 0%{transform:translateY(0);opacity:0} 20%{opacity:1} 100%{transform:translateY(-320px);opacity:0} }
  .neon { position:relative; border-radius:22px; padding:2px; overflow:hidden; box-shadow:0 0 34px rgba(228,68,12,.35); }
  .neon::before { content:""; position:absolute; inset:-60%;
    background:conic-gradient(from 0deg,#E4440C,transparent 30%,#fff 50%,transparent 70%,#E4440C); animation:spin 5s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .neon > .in { position:relative; background:#0B1422; border-radius:20px; }
  .rise { opacity:0; transform:translateY(18px); animation:rise .7s ease forwards; }
  @keyframes rise { to { opacity:1; transform:none; } }
  .badge { width:72px; height:72px; margin:0 auto; border-radius:9999px; border:2px solid #E4440C;
    background:#101C2E; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1px; box-shadow:0 0 16px rgba(228,68,12,.45); }
  .vs { font-family:'Bebas Neue',sans-serif; font-size:44px; color:#E4440C; text-shadow:0 0 16px rgba(228,68,12,.9); animation:pulse 2s ease-in-out infinite; }
  .round { display:inline-block; font-family:'Bebas Neue',sans-serif; font-size:40px; line-height:1; letter-spacing:.12em; color:#fff;
    background:rgba(228,68,12,.25); border:2px solid #E4440C; border-radius:9999px; padding:8px 28px;
    box-shadow:0 0 22px rgba(228,68,12,.55); text-shadow:0 0 12px rgba(228,68,12,.8); white-space:nowrap; }
  .tile { background:#101C2E; border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:8px 0; text-align:center; }
  .tile b { display:block; font-family:'Bebas Neue',sans-serif; font-size:30px; line-height:1; color:#fff; }
  .tile span { font-size:10px; letter-spacing:.12em; color:#9FB0C8; }
  .card { background:#16253B; border:1px solid rgba(255,255,255,.08); border-radius:16px; }
  .card.mine { border-color:#E4440C; box-shadow:0 0 18px rgba(228,68,12,.35); }

  /* ---------- Gallery grid ---------- */
  .ggrid { display:grid; gap:6px; }
  .ggrid.s { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .ggrid.m { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .ggrid.l { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .gitem.sel { outline:3px solid #E4440C; outline-offset:-3px; }
  .gcheck { position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:9999px; background:#E4440C; color:#fff;
    font:800 13px/22px 'Inter',sans-serif; text-align:center; }

  /* ---------- Field ---------- */
  .field { position:relative; width:100%; max-width:480px; margin:0 auto; aspect-ratio:400/380; }
  .field svg { position:absolute; inset:0; width:100%; height:100%; }
  .pos { position:absolute; transform:translate(-50%,-50%); z-index:5; }
  .pos:hover, .pos.open { z-index:40; }
  .spot { display:flex; flex-direction:column; align-items:center; cursor:default;
    animation:spotpop .55s cubic-bezier(.2,1.5,.4,1) both; animation-delay:var(--d,0s); }
  .pos.multi .spot { cursor:pointer; }
  @keyframes spotpop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
  .dot { position:relative; width:34px; height:34px; border-radius:9999px; background:#101C2E; border:2px solid #E4440C;
    display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:17px; line-height:1;
    box-shadow:0 0 12px rgba(228,68,12,.7), 0 2px 6px rgba(0,0,0,.5); }
  .pos.multi .dot { background:#E4440C; }
  .pos:hover .dot, .pos.open .dot { transform:scale(1.12); }
  .pos.empty { z-index:3; }
  .pos.empty .dot { background:rgba(16,28,46,.45); border:2px dashed rgba(255,255,255,.6); box-shadow:none;
    color:rgba(255,255,255,.85); font-size:15px; letter-spacing:.04em; }
  .pos.empty:hover .dot { transform:none; }
  .cnt { position:absolute; top:-7px; right:-7px; min-width:16px; height:16px; padding:0 3px; border-radius:9999px; background:#fff; color:#101C2E;
    font:800 10px/16px 'Inter',sans-serif; text-align:center; }
  .star { position:absolute; top:-9px; left:-6px; font-size:13px; color:#FFD34D; text-shadow:0 0 4px #000; }
  .lbl { margin-top:2px; max-width:56px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font:700 10px/1.1 'Inter',sans-serif; color:#fff; text-shadow:0 1px 3px #000, 0 0 4px #000; }
  .pop { display:none; position:absolute; left:50%; bottom:100%; transform:translateX(-50%); padding-bottom:6px; }
  .pos.below .pop { bottom:auto; top:100%; padding-bottom:0; padding-top:6px; }
  .pos.l .pop { left:0; transform:none; }
  .pos.r .pop { left:auto; right:0; transform:none; }
  .pos:hover .pop, .pos.open .pop { display:block; }
  .pop > div { min-width:170px; background:#0B1422; border:1px solid #E4440C; border-radius:12px; padding:8px 10px; box-shadow:0 8px 24px rgba(0,0,0,.6); }
  .pop h4 { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:.1em; color:#E4440C; margin-bottom:4px; }
  .pop li { display:flex; gap:8px; align-items:center; font-size:13px; padding:3px 0; border-top:1px solid rgba(255,255,255,.08); white-space:nowrap; }
  .pop li b { font-family:'Bebas Neue',sans-serif; font-size:18px; color:#E4440C; min-width:34px; }
</style>

<body>

<header class="fixed top-0 left-0 w-full h-16 bg-navy z-50 flex items-center justify-between px-4 border-b border-white/10">
  <a href="#/" class="flex items-center" aria-label="KickDeezBallz Home">

  </a>
  <button id="menuBtn" aria-label="Open menu" class="p-2">

  <button id="closeBtn" aria-label="Close menu" class="absolute top-4 right-4 text-3xl leading-none">&times;</button>
  <div class="font-display text-4xl mt-8 mb-8">KICK <span class="text-orange">DEEZ</span> BALLZ</div>
  <a href="#/" class="navlink block py-3 font-display text-3xl border-b border-white/10">Home</a>
  <a href="#/schedule" class="navlink block py-3 font-display text-3xl text-orange border-b border-white/10">Schedule</a>
  <a href="#/standings" class="navlink block py-3 font-display text-3xl border-b border-white/10">Standings</a>
  <a href="#/roster" class="navlink block py-3 font-display text-3xl text-orange border-b border-white/10">Roster</a>
  <a href="#/achievements" class="navlink block py-3 font-display text-3xl border-b border-white/10">Achievements</a>
  <a href="#/gallery" class="navlink block py-3 font-display text-3xl text-orange border-b border-white/10">Gallery<span data-soon="gallery" class="ml-2 align-middle font-body text-[10px] font-bold tracking-widest text-orange border border-orange/60 rounded-full px-2 py-0.5">COMING SOON</span></a>
  <a href="#/merch" class="navlink block py-3 font-display text-3xl border-b border-white/10">Merch<span data-soon="merch" class="ml-2 align-middle font-body text-[10px] font-bold tracking-widest text-orange border border-orange/60 rounded-full px-2 py-0.5">COMING SOON</span></a>
</nav>

<main id="app" class="pt-16 min-h-screen"></main>
<footer class="text-center text-xs text-white/40 py-8">&copy; KickDeezBallz.com</footer>

<script>
const db = supabase.createClient(KDB_CONFIG.SUPABASE_URL, KDB_CONFIG.SUPABASE_ANON_KEY);
const app = document.getElementById('app');
let timer = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const record = t => t ? `${t.wins}-${t.losses}${t.ties ? '-' + t.ties : ''}` : '0-0';
const initials = t => {
  if (!t) return 'TBD';
  if (t.is_our_team) return 'KDZ';
  const w = t.team_name.trim().split(/\s+/);
  return (w.length === 1 ? w[0].slice(0, 3) : w.slice(0, 3).map(x => x[0]).join('')).toUpperCase();
};

/* Bye weeks and time ranges */
const isBye = g => /bye/i.test(g.round_label || '');
const fmtDate = g => {
  if (!g.match_at) return g.match_time || '';
  const d = new Date(g.match_at);
  const day = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', timeZone:'America/Los_Angeles' });
  if (isBye(g)) return day;
  const t = d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZone:'America/Los_Angeles' });
  const range = g.match_time && /[-\u2013]/.test(g.match_time) ? g.match_time : t;
  return `${day}, ${range}`;
};

/* ---------- Field coordinates (exact map pins) ---------- */
const FIELD_COORDS = {
  'morley field sports complex': [32.73774798852176, -117.13807689220057]
};
const mapLinks = field => {
  const name = String(field || '');
  const c = FIELD_COORDS[name.trim().toLowerCase()];
  if (c) {
    const ll = `${c[0]},${c[1]}`;
    return {
      google: `https://www.google.com/maps/search/?api=1&query=${ll}`,
      apple: `https://maps.apple.com/?ll=${ll}&q=${encodeURIComponent(name)}`
    };
  }
  const q = encodeURIComponent(name);
  return { google: `https://www.google.com/maps/search/?api=1&query=${q}`, apple: `https://maps.apple.com/?q=${q}` };
};
const isApple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);

const teamBlock = (t, fallback) => `
  <div class="flex-1 text-center">
    <div class="badge">${esc(initials(t))}</div>
    <div class="font-display text-2xl leading-tight mt-2">${esc(t ? t.team_name : fallback)}</div>
    <div class="text-sm font-extrabold text-orange tracking-wide">${t ? record(t) : '--'}</div>
  </div>`;

/* ---------- Final score helpers ---------- */
function resultInfo(game, home, away) {
  const hs = game.home_score, aw = game.away_score;
  if (hs === null || hs === undefined || aw === null || aw === undefined) return null;
  const hn = esc(home?.team_name || 'TBD'), an = esc(away?.team_name || 'TBD');
  let line;
  if (hs > aw) line = `<span class="text-orange font-bold">W</span> ${hn} &nbsp; <span class="text-white/60 font-bold">L</span> ${an}`;
  else if (hs < aw) line = `<span class="text-orange font-bold">W</span> ${an} &nbsp; <span class="text-white/60 font-bold">L</span> ${hn}`;
  else line = `<span class="font-bold">Tie game</span>`;
  return { hs, aw, line };
}

/* ---------- Seasons: tables "Season 1".."Season 7" and "Season 1 Teams".. ---------- */
const SEASON_NUMS = [1, 2, 3, 4, 5, 6, 7];
const gamesT = n => `Season ${n}`;
const teamsT = n => `Season ${n} Teams`;

async function teamMapFor(n) {
  const { data } = await db.from(teamsT(n)).select('*');
  return Object.fromEntries((data || []).map(t => [t.id, t]));
}

async function findActiveGame() {
  const res = await Promise.all(SEASON_NUMS.map(async n => {
    const r = await db.from(gamesT(n)).select('*').eq('is_active', true)
      .order('match_at', { ascending: true }).limit(1);
    return { n, data: r.data, error: r.error };
  }));
  const found = res.filter(r => r.data && r.data.length).map(r => ({ season: r.n, game: r.data[0] }));
  found.sort((a, b) => new Date(a.game.match_at || 0) - new Date(b.game.match_at || 0));
  const allFailed = res.every(r => r.error);
  return { best: found[0] || null, error: allFailed ? res[0].error : null };
}

/* ---------- Drawer ---------- */
const drawer = document.getElementById('drawer'), overlay = document.getElementById('overlay');
const openMenu = () => { drawer.classList.remove('translate-x-full'); overlay.classList.remove('hidden'); };
const closeMenu = () => { drawer.classList.add('translate-x-full'); overlay.classList.add('hidden'); };
document.getElementById('menuBtn').onclick = openMenu;
document.getElementById('closeBtn').onclick = closeMenu;
overlay.onclick = closeMenu;
document.querySelectorAll('.navlink').forEach(a => a.addEventListener('click', closeMenu));

/* ---------- Home ---------- */
async function renderHome() {
  const sparks = Array.from({length: 10}, (_, i) =>
    `<span class="spark" style="left:${8 + i * 9}%;animation-delay:${(i * 0.45).toFixed(2)}s"></span>`).join('');
  const streaks = [18, 34, 52, 70].map((t, i) =>
    `<span class="streak" style="top:${t}%;animation-delay:${i * 0.7}s"></span>`).join('');

  app.innerHTML = `
  <section class="hero px-3 pt-6 pb-14 text-center">
    <div class="glow"></div>${streaks}${sparks}
    <div class="relative">
      <h1 class="sr-only">KickDeezBallz</h1>
      <img src="KickDeezBallz_Logo_Transparent.png" alt="KickDeezBallz logo" class="mainlogo w-full max-w-md mx-auto" onerror="this.style.display='none'">
    </div>
  </section>
  <section id="nextGame" class="px-4 -mt-6 pb-6 relative">
    <div class="text-center text-white/60 py-8">Loading next game...</div>
  </section>`;

  const { best, error } = await findActiveGame();
  const box = document.getElementById('nextGame');
  if (!box) return;
  if (error) { box.innerHTML = `<div class="card p-5 text-center text-sm">Could not load the next game.<br><span class="text-white/50">${esc(error.message)}</span></div>`; return; }
  if (!best) { box.innerHTML = `<div class="card p-6 text-center font-display text-2xl">No game scheduled yet</div>`; return; }

  const teams = await teamMapFor(best.season);
  const g = { ...best.game, home: teams[best.game.home_team_id], away: teams[best.game.away_team_id] };
  const links = mapLinks(g.field_name);
  const main = isApple ? links.apple : links.google;
  box.innerHTML = `
  <div class="neon rise" style="animation-delay:.5s"><div class="in p-5">
    <div class="flex items-center justify-between mb-4">
      <span class="font-display text-2xl tracking-widest text-orange">NEXT GAME</span>
      <span class="text-[11px] text-white/60 text-right">${esc(g.league_name)} &middot; Season ${best.season}</span>
    </div>
    ${g.round_label ? `<div class="text-center mb-4"><span class="round">${esc(g.round_label)}</span></div>` : ''}
    <div class="flex items-start">
      ${teamBlock(g.home, 'TBD')}
      <div class="px-1 pt-3 text-center">
        <div class="vs">VS</div>
      </div>
      ${teamBlock(g.away, 'TBD')}
    </div>
    <div class="text-center mt-5">
      <div class="font-display text-3xl">${esc(fmtDate(g))}</div>
      <div class="text-sm text-white/80 mt-1">${esc(g.field_name)}, ${esc(g.field_number)}</div>
      <div class="text-xs text-orange font-semibold mt-1">Arrive ${esc(g.arrival_buffer)}</div>
    </div>
    <div id="cd" class="grid grid-cols-4 gap-2 mt-5"></div>
    <div class="grid grid-cols-2 gap-3 mt-5">
      <a href="${main}" target="_blank" rel="noopener" class="bg-orange text-white text-center font-display text-2xl py-3 rounded-xl shadow-lg active:scale-95 transition">Get Directions</a>
      <a href="#/schedule" class="border-2 border-white text-white text-center font-display text-2xl py-3 rounded-xl active:scale-95 transition">Full Schedule</a>
    </div>
    <details class="mt-4 text-sm">
      <summary class="cursor-pointer text-orange font-semibold">Parking tips</summary>
      <p class="mt-2 text-white/80 leading-relaxed">${esc(g.parking_tips)}</p>
    </details>
  </div></div>`;

  const res = resultInfo(g, g.home, g.away);
  if (res) {
    const cd = document.getElementById('cd');
    cd.className = 'mt-5 text-center';
    cd.innerHTML = `<div class="font-display text-5xl text-orange leading-none">${res.hs} - ${res.aw}</div>
      <div class="text-xs font-bold tracking-widest text-white/70 mt-1">FINAL</div>
      <div class="text-sm mt-1">${res.line}</div>`;
  } else if (g.match_at) {
    startCountdown(new Date(g.match_at).getTime());
  }
}

function startCountdown(target) {
  const el = document.getElementById('cd');
  const tile = (n, l) => `<div class="tile"><b>${String(n).padStart(2, '0')}</b><span>${l}</span></div>`;
  const tick = () => {
    const diff = target - Date.now();
    if (!document.getElementById('cd')) return clearInterval(timer);
    if (diff <= 0) {
      el.className = 'mt-5';
      el.innerHTML = `<div class="font-display text-4xl text-center text-orange">GAME TIME!</div>`;
      return clearInterval(timer);
    }
    const d = Math.floor(diff / 864e5), h = Math.floor(diff % 864e5 / 36e5),
          m = Math.floor(diff % 36e5 / 6e4), s = Math.floor(diff % 6e4 / 1e3);
    const same = new Date(target).toDateString() === new Date().toDateString();
    el.innerHTML = same
      ? `<div class="col-span-4 text-center font-display text-3xl text-orange mb-1">GAME DAY!</div>` + tile(h,'HRS') + tile(m,'MIN') + tile(s,'SEC') + tile(d,'DAYS')
      : tile(d,'DAYS') + tile(h,'HRS') + tile(m,'MIN') + tile(s,'SEC');
  };
  tick(); timer = setInterval(tick, 1000);
}

/* ---------- Roster ---------- */
const POSITION_ORDER = ['P', 'C', '1B', '2B', '3B', 'SS', 'L', 'SL', 'LC', 'RC', 'SR', 'R', 'UT'];

const POS_ALIAS = {
  'PITCHER':'P', 'CATCHER':'C', 'FIRST BASE':'1B', 'SECOND BASE':'2B', 'THIRD BASE':'3B', 'SHORTSTOP':'SS',
  'LEFT FIELD':'L', 'LF':'L', 'SHORT LEFT':'SL', 'LEFT CENTER':'LC', 'LCF':'LC',
  'RIGHT CENTER':'RC', 'RCF':'RC', 'SHORT RIGHT':'SR', 'RIGHT FIELD':'R', 'RF':'R',
  'UTILITY':'UT', 'UTIL':'UT', 'UTILITY PLAYER':'UT'
};
const normPos = raw => { const u = String(raw || '').trim().toUpperCase(); return POS_ALIAS[u] || u; };

// x, y on a 400 x 380 field
const SPOTS = {
  'P':[200,258],  'C':[200,352],
  '1B':[305,250], '2B':[245,208], 'SS':[155,208], '3B':[95,250],
  'SL':[155,172], 'SR':[245,172],
  'L':[58,140],   'LC':[148,100], 'RC':[252,100], 'R':[342,140],
  'UT':[345,335]
};

// A player can have several positions, e.g. "R, RC" or "R/RC" or "R and RC" or "R RC"
function parsePositions(raw) {
  const out = [];
  String(raw || '').split(/\s*(?:,|\/|\\|&|;|\||\+|-|\band\b)\s*/i).forEach(tok => {
    const t = normPos(tok);
    if (!t) return;
    if (SPOTS[t]) { if (!out.includes(t)) out.push(t); return; }
    tok.trim().split(/\s+/).forEach(w => {
      const n = normPos(w);
      if (SPOTS[n] && !out.includes(n)) out.push(n);
    });
  });
  return out;
}

function rosterRank(p) {
  if (String(p.status_tag || '').trim().toLowerCase() === 'captain') return 0;
  const first = parsePositions(p.preferred_position)[0];
  const i = POSITION_ORDER.indexOf(first);
  return i === -1 ? 100 : 1 + i;
}

const isCaptain = p => String(p.status_tag || '').trim().toLowerCase() === 'captain';

function fieldHTML(players) {
  const groups = {};
  players.forEach(p => {
    parsePositions(p.preferred_position).forEach(k => (groups[k] = groups[k] || []).push(p));
  });

  // Empty positions: dashed circle with the position code
  const empties = POSITION_ORDER.filter(k => !groups[k]).map((k, j) => {
    const [x, y] = SPOTS[k];
    return `<div class="pos empty" style="left:${(x / 4).toFixed(2)}%;top:${(y / 3.8).toFixed(2)}%">
      <div class="spot" style="--d:${(0.05 + j * 0.05).toFixed(2)}s" title="${esc(k)} (open)"><div class="dot">${esc(k)}</div></div>
    </div>`;
  }).join('');

  let i = 0;
  const spots = Object.keys(groups).map(k => {
    const list = groups[k], [x, y] = SPOTS[k];
    const multi = list.length > 1;
    const cls = ['pos', multi ? 'multi' : '', y < 160 ? 'below' : '', x < 110 ? 'l' : '', x > 290 ? 'r' : ''].join(' ');
    const d = (0.15 + i++ * 0.09).toFixed(2);
    const cap = list.some(isCaptain) ? '<span class="star">&#9733;</span>' : '';
    const title = k === 'UT' ? 'UT - Utility' : k;
    let inner;
    if (multi) {
      inner = `<div class="spot" style="--d:${d}s" tabindex="0" role="button" aria-label="${esc(title)}: ${list.length} players">
        <div class="dot">${cap}<svg width="18" height="18" viewBox="0 0 24 24" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="cnt">${list.length}</span></div>
        <div class="lbl">${esc(k)}</div>
      </div>
      <div class="pop"><div><h4>${esc(title)}</h4><ul>${list.map(p =>
        `<li><b>#${esc(p.jersey_number)}</b><span>${esc(p.player_name)}${isCaptain(p) ? ' &#9733;' : ''}</span></li>`).join('')}</ul></div></div>`;
    } else {
      const p = list[0];
      const first = String(p.player_name || '').trim().split(/\s+/)[0];
      inner = `<div class="spot" style="--d:${d}s" title="${esc(p.player_name)} (${esc(parsePositions(p.preferred_position).join(', '))})">
        <div class="dot">${cap}${esc(p.jersey_number)}</div>
        <div class="lbl">${esc(first)}</div>
      </div>`;
    }
    return `<div class="${cls}" style="left:${(x / 4).toFixed(2)}%;top:${(y / 3.8).toFixed(2)}%">${inner}</div>`;
  }).join('');

  return `<div class="card p-3 mb-5"><div class="field">${fieldSVG()}${empties}${spots}</div>
    <p class="text-center text-[11px] text-white/50 mt-2">Hover or tap a <span class="text-orange font-bold">&#9776;</span> spot to see everyone at that position. UT is the utility spot for players who can play multiple positions. Dashed circles are open positions.</p></div>`;
}

/* ---------- Standings ---------- */
const winPct = t => {
  const gp = (t.wins || 0) + (t.losses || 0) + (t.ties || 0);
  return gp ? ((t.wins || 0) + 0.5 * (t.ties || 0)) / gp : 0;
};
const fmtPct = t => {
  const gp = (t.wins || 0) + (t.losses || 0) + (t.ties || 0);
  return gp ? winPct(t).toFixed(3).replace(/^0/, '') : '.000';
};

async function prepPhoto(file) {
  if (/gif/i.test(file.type)) return { blob: file, ext: 'gif', type: file.type };
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const s = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (blob) return { blob, ext: 'jpg', type: 'image/jpeg' };
  } catch (e) {}
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  return { blob: file, ext, type: file.type || 'image/jpeg' };
}

// Talk to the Supabase function (PIN-protected actions)
async function adminCall(body) {
  const r = await db.functions.invoke(UPLOAD_FN, { body });

// Reusable popup with a PIN field. onOk(pin) runs when the user taps the button.
function pinModal(title, bodyHTML, okLabel, onOk, after) {
  const m = document.getElementById('upModal');
  m.innerHTML = `
  <div class="card w-full max-w-sm p-5 max-h-[90vh] overflow-y-auto">
    <div class="font-display text-3xl mb-3">${title}</div>
    <label class="text-xs text-white/70">Team PIN</label>
    <input id="pmPin" type="password" autocomplete="off" class="w-full mb-3 px-3 py-2 rounded-lg bg-navy border border-white/20" value="${esc(sessionStorage.getItem('kdz_pin') || '')}">
    ${bodyHTML}
    <div id="pmMsg" class="text-sm min-h-[20px] mb-3"></div>
    <div class="grid grid-cols-2 gap-3">
      <button id="pmCancel" class="border-2 border-white font-display text-xl py-2 rounded-xl">Cancel</button>
      <button id="pmOk" class="bg-orange font-display text-xl py-2 rounded-xl">${okLabel}</button>
    </div>
  </div>`;
  m.classList.remove('hidden'); m.classList.add('flex');
  const msg = t => { document.getElementById('pmMsg').textContent = t; };
  const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); };
  document.getElementById('pmCancel').onclick = close;
  if (after) after();
  document.getElementById('pmOk').onclick = async () => {
    const pin = document.getElementById('pmPin').value.trim();
    if (!pin) return msg('Enter the team PIN.');
    const btn = document.getElementById('pmOk'); btn.disabled = true; btn.classList.add('opacity-50');
    try {
      await onOk(pin);
      sessionStorage.setItem('kdz_pin', pin);
      close(); renderGallery();
    } catch (e) {
      msg(e.message || 'Something went wrong.');
      btn.disabled = false; btn.classList.remove('opacity-50');
    }
  };
}

function wirePicker() {
  const sel = document.getElementById('pmAlbum'), nb = document.getElementById('pmNewAlbum');
  sel.onchange = () => { nb.classList.toggle('hidden', sel.value !== '__new__'); if (sel.value === '__new__') nb.focus(); };
}
function readPicker() {
  const sel = document.getElementById('pmAlbum'), nb = document.getElementById('pmNewAlbum');
  if (sel.value === '__new__') {
    const v = nb.value.trim();
    if (!v) throw new Error('Type a name for the new album.');
    return v;
  }
  return sel.value;
}

      if ((album || null) !== (p.album || null)) await adminCall({ action: 'move', pin, ids: [p.id], album });
      closeLightbox();
    }, wirePicker);
}

function renameAlbumPopup(name) {
  pinModal('RENAME <span class="text-orange">ALBUM</span>',
    `<label class="text-xs text-white/70">New name</label>
     <input id="pmName" type="text" maxlength="40" value="${esc(name)}" class="w-full mb-3 px-3 py-2 rounded-lg bg-navy border border-white/20">`,
    'Rename',
    async pin => {
      const to = document.getElementById('pmName').value.trim();
      if (!to) throw new Error('Type a name.');
      await adminCall({ action: 'rename_album', pin, from: name, to });
      galleryAlbum = to;
    });
}

function deleteAlbumPopup(name) {
  pinModal('DELETE <span class="text-orange">ALBUM</span>',
    `<p class="text-sm text-white/80 mb-3">Delete the album "${esc(name)}"? The photos stay and move to Unsorted.</p>`,
    'Delete album',
    async pin => {
      await adminCall({ action: 'delete_album', pin, name });
      galleryAlbum = '__all__';
    });
}

function closeLightbox() {
  const lb = document.getElementById('lb'), vid = document.getElementById('lbVid');
  if (!lb) return;
  if (vid) { vid.pause(); vid.removeAttribute('src'); }
  lb.classList.add('hidden'); lb.classList.remove('flex');
}

async function uploadOne(kind, file, pin, name, caption, album) {
  let blob = file, ext = (file.name.split('.').pop() || '').toLowerCase(), type = file.type;
  if (kind === 'photo') ({ blob, ext, type } = await prepPhoto(file));
  const s = await adminCall({ action: 'sign', kind, pin, ext });
  const up = await db.storage.from('photos').uploadToSignedUrl(s.path, s.token, blob, { contentType: type });
  if (up.error) throw new Error(up.error.message);
  await adminCall({ action: 'commit', kind, pin, path: s.path, caption, name, album });
}

async function openUpload(kind) {
  const isVid = kind === 'video';
  const pre = (galleryAlbum !== '__all__' && galleryAlbum !== '__none__') ? galleryAlbum : '';
  pinModal(`ADD <span class="text-orange">${isVid ? 'VIDEO' : 'PHOTOS'}</span>`,
    `${albumPickerHTML(allAlbums, pre, 'No album')}
     <label class="text-xs text-white/70 mt-1 block">Your name (optional)</label>
     <input id="upName" type="text" maxlength="60" class="w-full mb-3 px-3 py-2 rounded-lg bg-navy border border-white/20" value="${esc(localStorage.getItem('kdz_name') || '')}">
     <label class="text-xs text-white/70">Caption (optional)</label>
     <input id="upCap" type="text" maxlength="200" class="w-full mb-3 px-3 py-2 rounded-lg bg-navy border border-white/20">
     <input id="upFile" type="file" accept="${isVid ? 'video/*' : 'image/*'}" ${isVid ? '' : 'multiple'} class="w-full mb-3 text-sm">`,
    'Upload',
    async pin => {
      const album = readPicker();
      const name = document.getElementById('upName').value.trim();
      const cap = document.getElementById('upCap').value.trim();
      const files = Array.from(document.getElementById('upFile').files || []);
      if (!files.length) throw new Error('Choose a file first.');
      if (isVid && files[0].size > MAX_VIDEO_MB * 1048576) throw new Error(`Video is over ${MAX_VIDEO_MB} MB. Trim it or pick a shorter one.`);
      for (let i = 0; i < files.length; i++) {
        document.getElementById('pmMsg').textContent = `Uploading ${i + 1} of ${files.length}...`;
        await uploadOne(kind, files[i], pin, name, cap, album);
      }
      if (name) localStorage.setItem('kdz_name', name);
      galleryAlbum = album || '__all__';
    }, wirePicker);
}

async function renderGallery() {
  if (COMING_SOON.gallery) return renderSoon('GALLERY', 'Team photos are on the way. Check back soon.');
  app.innerHTML = `
  <div class="px-4 py-6 pb-28">
    <h2 class="font-display text-5xl mb-4">THE <span class="text-orange">GALLERY</span></h2>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <button id="addPhoto" class="bg-orange font-display text-2xl py-3 rounded-xl active:scale-95 transition">+ Add Photo</button>
      <button id="addVideo" class="border-2 border-white font-display text-2xl py-3 rounded-xl active:scale-95 transition">+ Add Video</button>
    </div>
    <div class="flex items-center justify-between gap-2 mb-3">
      <div id="typeTabs" class="flex gap-1"></div>
      <div id="sizeTabs" class="flex items-center gap-1"></div>
    </div>
    <div id="albumChips" class="flex flex-wrap gap-2 mb-3"></div>
    <div class="flex items-center justify-between gap-2 mb-4">
      <button id="selectBtn" class="px-3 py-1 rounded-lg font-display text-lg border border-white/40">Select</button>
      <div id="albumTools" class="flex gap-4 text-sm"></div>
    </div>
    <div id="list" class="text-white/60">Loading...</div>
  </div>
  <div id="selBar" class="fixed bottom-0 left-0 right-0 z-[72] hidden items-center gap-2 bg-[#0B1422] border-t-2 border-orange p-3"></div>
  <div id="upModal" class="fixed inset-0 bg-black/80 z-[75] hidden items-center justify-center p-4"></div>
  <div id="lb" class="fixed inset-0 bg-black/90 z-[70] hidden items-center justify-center p-4">
    <button id="lbClose" aria-label="Close" class="absolute top-4 right-5 text-4xl leading-none z-10">&times;</button>
    <figure class="max-w-full max-h-full text-center">
      <img id="lbImg" class="max-h-[70vh] max-w-full mx-auto rounded-lg hidden" alt="">
      <video id="lbVid" class="max-h-[70vh] max-w-full mx-auto rounded-lg hidden" controls playsinline></video>
      <figcaption id="lbCap" class="mt-3 text-sm text-white/80"></figcaption>
      <div id="lbActions" class="mt-3 flex gap-2 justify-center">
        <button id="lbMove" class="px-4 py-1 rounded-lg font-display text-lg bg-white/10">Move</button>
        <button id="lbEdit" class="px-4 py-1 rounded-lg font-display text-lg bg-white/10">Edit</button>
        <button id="lbDelete" class="px-4 py-1 rounded-lg font-display text-lg bg-white/10 text-orange">Delete</button>
      </div>
    </figure>
  </div>`;
  document.getElementById('addPhoto').onclick = () => openUpload('photo');
  document.getElementById('addVideo').onclick = () => openUpload('video');

  const list = document.getElementById('list');
  const [pr, ar] = await Promise.all([
    db.from('gallery_photos').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: false }),
    db.from('gallery_albums').select('name')
  ]);
  if (!document.getElementById('list')) return;
  if (pr.error) { list.textContent = 'Could not load photos: ' + pr.error.message; return; }
  const data = pr.data || [];
  allAlbums = [...new Set([...(ar.data || []).map(a => a.name), ...data.map(p => p.album)].filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));

  const lb = document.getElementById('lb'), img = document.getElementById('lbImg'), vid = document.getElementById('lbVid');
  lb.onclick = e => { if (e.target.id !== 'lbImg' && e.target.id !== 'lbVid' && !e.target.closest('#lbActions')) closeLightbox(); };
  document.getElementById('lbClose').onclick = closeLightbox;
  let current = null;
  document.getElementById('lbMove').onclick = () => current && movePopup([current.id], current.album);
  document.getElementById('lbEdit').onclick = () => current && editPopup(current);
  document.getElementById('lbDelete').onclick = () => current && deletePopup([current.id]);

  const tabCls = on => `px-3 py-1 rounded-lg font-display text-lg ${on ? 'bg-orange' : 'bg-white/10'}`;
  let shown = [];

  function updateBar() {
    const bar = document.getElementById('selBar');
    if (!bar) return;
    const sb = document.getElementById('selectBtn');
    sb.textContent = selectMode ? 'Done' : 'Select';
    sb.className = 'px-3 py-1 rounded-lg font-display text-lg border ' + (selectMode ? 'border-orange text-orange' : 'border-white/40');
    if (!selectMode) { bar.classList.add('hidden'); bar.classList.remove('flex'); return; }
    bar.classList.remove('hidden'); bar.classList.add('flex');
    bar.innerHTML = `<span class="text-sm flex-1">${selected.size} selected</span>
      <button id="selAll" class="px-3 py-1 rounded-lg font-display text-lg bg-white/10">All</button>
      <button id="selMove" class="px-3 py-1 rounded-lg font-display text-lg bg-orange ${selected.size ? '' : 'opacity-40'}">Move</button>
      <button id="selDel" class="px-3 py-1 rounded-lg font-display text-lg bg-white/10 text-orange ${selected.size ? '' : 'opacity-40'}">Delete</button>`;
    document.getElementById('selAll').onclick = () => { shown.forEach(p => selected.add(p.id)); draw(); };
    document.getElementById('selMove').onclick = () => { if (selected.size) movePopup([...selected]); };
    document.getElementById('selDel').onclick = () => { if (selected.size) deletePopup([...selected]); };
  }

  function draw() {
    if (!document.getElementById('list')) return;

    // Type tabs: All / Photos / Videos
    const types = [['all', 'All'], ['photo', 'Photos'], ['video', 'Videos']];
    const typeBox = document.getElementById('typeTabs');
    typeBox.innerHTML = types.map(([k, l]) => `<button data-t="${k}" class="${tabCls(k === galleryType)}">${l}</button>`).join('');
    typeBox.querySelectorAll('button').forEach(b => b.onclick = () => { galleryType = b.dataset.t; draw(); });

    // Size tabs: S / M / L
    const sizeBox = document.getElementById('sizeTabs');
    sizeBox.innerHTML = '<span class="text-[11px] text-white/50 mr-1">Size</span>' +
      [['s', 'S'], ['m', 'M'], ['l', 'L']].map(([k, l]) => `<button data-z="${k}" class="${tabCls(k === gallerySize)}">${l}</button>`).join('');
    sizeBox.querySelectorAll('button').forEach(b => b.onclick = () => {
      gallerySize = b.dataset.z; localStorage.setItem('kdz_gsize', gallerySize); draw();
    });

    // Album chips (with counts) + New Album button
    const hasUnsorted = data.some(p => !p.album);
    const count = f => data.filter(f).length;
    const chips = [{ key: '__all__', label: `All (${data.length})` },
      ...allAlbums.map(a => ({ key: a, label: `${a} (${count(p => p.album === a)})` })),
      ...(allAlbums.length && hasUnsorted ? [{ key: '__none__', label: `Unsorted (${count(p => !p.album)})` }] : [])];
    if (!chips.some(c => c.key === galleryAlbum)) galleryAlbum = '__all__';
    const chipBox = document.getElementById('albumChips');
    chipBox.innerHTML = chips.map((c, i) =>
      `<button data-c="${i}" class="px-3 py-1 rounded-lg font-display text-lg ${c.key === galleryAlbum ? 'bg-orange' : 'bg-white/10'}">${esc(c.label)}</button>`).join('') +
      `<button id="newAlbumBtn" class="px-3 py-1 rounded-lg font-display text-lg border border-orange text-orange">+ New Album</button>`;
    chipBox.querySelectorAll('button[data-c]').forEach(b => b.onclick = () => { galleryAlbum = chips[Number(b.dataset.c)].key; draw(); });
    document.getElementById('newAlbumBtn').onclick = newAlbumPopup;

    // Rename / delete the selected album
    const tools = document.getElementById('albumTools');
    const real = galleryAlbum !== '__all__' && galleryAlbum !== '__none__';
    tools.innerHTML = real
      ? `<button id="renAlbum" class="text-orange underline">Rename album</button><button id="delAlbum" class="text-white/60 underline">Delete album</button>`
      : '';
    if (real) {
      document.getElementById('renAlbum').onclick = () => renameAlbumPopup(galleryAlbum);
      document.getElementById('delAlbum').onclick = () => deleteAlbumPopup(galleryAlbum);
    }
    document.getElementById('selectBtn').onclick = () => { selectMode = !selectMode; if (!selectMode) selected.clear(); draw(); };

    // Filtered grid
    shown = data.filter(p =>
      (galleryAlbum === '__all__' ? true : galleryAlbum === '__none__' ? !p.album : p.album === galleryAlbum) &&
      (galleryType === 'all' ? true : (p.media_type || 'photo') === galleryType));
    updateBar();
    if (!shown.length) {
      list.className = 'text-white/60';
      list.textContent = data.length
        ? (real ? 'This album is empty. Tap Select, pick photos, then Move to add them here.' : 'Nothing matches this filter.')
        : 'Nothing here yet. Be the first to add a photo!';
      return;
    }
    list.className = 'ggrid ' + gallerySize;
    const playCls = gallerySize === 's' ? 'text-xl' : 'text-4xl';
    list.innerHTML = shown.map((p, i) => {
      const url = esc(photoUrl(p.image_path));
      const on = selected.has(p.id);
      const inner = p.media_type === 'video'
        ? `<video src="${url}#t=0.1" muted playsinline preload="metadata" class="w-full h-full object-cover pointer-events-none"></video>
           <span class="absolute inset-0 flex items-center justify-center ${playCls} text-white drop-shadow pointer-events-none">&#9654;</span>`
        : `<img src="${url}" alt="${esc(p.caption || 'Team photo')}" loading="lazy" class="w-full h-full object-cover">`;
      return `<button data-i="${i}" class="gitem relative block overflow-hidden rounded-lg border border-white/10 bg-[#16253B] aspect-square ${on ? 'sel' : ''}">${inner}${on ? '<span class="gcheck">&#10003;</span>' : ''}</button>`;
    }).join('');
    list.querySelectorAll('button').forEach(b => b.onclick = () => {
      const p = shown[Number(b.dataset.i)];
      if (selectMode) {
        if (selected.has(p.id)) selected.delete(p.id); else selected.add(p.id);
        const on = selected.has(p.id);
        b.classList.toggle('sel', on);
        const chk = b.querySelector('.gcheck');
        if (on && !chk) b.insertAdjacentHTML('beforeend', '<span class="gcheck">&#10003;</span>');
        if (!on && chk) chk.remove();
        updateBar();
        return;
      }
      current = p;
      const url = photoUrl(p.image_path);
      img.classList.add('hidden'); vid.classList.add('hidden');
      if (p.media_type === 'video') { vid.src = url; vid.classList.remove('hidden'); }
      else { img.src = url; img.classList.remove('hidden'); }
      const by = p.uploaded_by ? ` (${p.uploaded_by})` : '';
      const al = p.album ? `[${p.album}] ` : '';
      document.getElementById('lbCap').textContent = al + (p.caption || '') + by;
      lb.classList.remove('hidden'); lb.classList.add('flex');
    });
  }
  draw();
}

async function renderMerch() {
  const saved = localStorage.getItem('kdz_msize');
  let merchSize = ['s', 'm', 'l'].includes(saved) ? saved : 'm';

  app.innerHTML = `
  <div class="px-4 py-6 pb-10">
    <h2 class="font-display text-5xl mb-4">TEAM <span class="text-orange">MERCH</span></h2>
    <div class="flex items-center justify-end gap-1 mb-4" id="mSizeTabs"></div>
    <div id="mlist" class="text-white/60">Loading...</div>
  </div>
  <div id="mlb" class="fixed inset-0 bg-black/90 z-[70] hidden items-center justify-center p-4">
    <button id="mlbClose" aria-label="Close" class="absolute top-4 right-5 text-4xl leading-none z-10">&times;</button>
    <button id="mlbPrev" aria-label="Previous" class="absolute left-2 top-1/2 -translate-y-1/2 text-5xl px-2 z-10">&#8249;</button>
    <button id="mlbNext" aria-label="Next" class="absolute right-2 top-1/2 -translate-y-1/2 text-5xl px-2 z-10">&#8250;</button>
    <figure class="max-w-full max-h-full text-center">
      <img id="mlbImg" class="max-h-[60vh] max-w-full mx-auto rounded-lg" alt="">
      <figcaption id="mlbCap" class="mt-3"></figcaption>
      <a id="mlbBuy" target="_blank" rel="noopener" class="inline-block mt-4 bg-orange text-white font-display text-2xl px-10 py-3 rounded-xl active:scale-95 transition">BUY NOW</a>
    </figure>
  </div>`;

  const list = document.getElementById('mlist');
  const { data, error } = await db.from('merch_items').select('*').order('sort_order', { ascending: true });
  if (!document.getElementById('mlist')) return;
  if (error) { list.textContent = 'Could not load merch: ' + error.message; return; }
  const items = data || [];
  if (!items.length) { list.textContent = 'No merch yet.'; return; }

  const money = n => '$' + Number(n).toFixed(2);
  const tabCls = on => `px-3 py-1 rounded-lg font-display text-lg ${on ? 'bg-orange' : 'bg-white/10'}`;
  const lb = document.getElementById('mlb'), lbImg = document.getElementById('mlbImg');
  const lbCap = document.getElementById('mlbCap'), lbBuy = document.getElementById('mlbBuy');
  let cur = 0;

  const closeLb = () => { lb.classList.add('hidden'); lb.classList.remove('flex'); };
  const showItem = i => {
    cur = (i + items.length) % items.length;
    const it = items[cur];
    lbImg.src = photoUrl(it.image_path);
    lbImg.alt = it.name || 'Team merch';
    lbCap.innerHTML = `<div class="font-display text-3xl">${esc(it.name)} &middot; <span class="text-orange">${money(it.price)}</span></div>` +
      (it.description ? `<p class="text-sm text-white/70 mt-1 max-w-sm mx-auto">${esc(it.description)}</p>` : '');
    const href = safeUrl(it.buy_url);
    lbBuy.classList.toggle('hidden', !href);
    if (href) lbBuy.href = href;
    lb.classList.remove('hidden'); lb.classList.add('flex');
  };

  lb.onclick = e => { if (e.target === lb) closeLb(); };
  document.getElementById('mlbClose').onclick = closeLb;
  document.getElementById('mlbPrev').onclick = () => showItem(cur - 1);
  document.getElementById('mlbNext').onclick = () => showItem(cur + 1);

  let sx = null;
  lb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', e => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) showItem(cur + (dx < 0 ? 1 : -1));
  });

  function draw() {
    const box = document.getElementById('mSizeTabs');
    if (!box) return;
    box.innerHTML = '<span class="text-[11px] text-white/50 mr-1">Size</span>' +
      [['s', 'S'], ['m', 'M'], ['l', 'L']].map(([k, l]) => `<button data-z="${k}" class="${tabCls(k === merchSize)}">${l}</button>`).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => {
      merchSize = b.dataset.z; localStorage.setItem('kdz_msize', merchSize); draw();
    });

    list.className = 'ggrid ' + merchSize;
    const priceCls = merchSize === 's' ? 'text-sm' : 'text-xl';
    list.innerHTML = items.map((it, i) => `
      <button data-i="${i}" class="gitem relative block overflow-hidden rounded-lg border border-white/10 bg-[#16253B] aspect-square" aria-label="${esc(it.name)}">
        <img src="${esc(photoUrl(it.image_path))}" alt="${esc(it.name)}" loading="lazy" class="w-full h-full object-cover">
        <span class="absolute bottom-1 left-1 bg-navy/85 border border-orange rounded-full px-2 py-0.5 font-display ${priceCls} leading-none">${money(it.price)}</span>
      </button>`).join('');
    list.querySelectorAll('button').forEach(b => b.onclick = () => showItem(Number(b.dataset.i)));
  }
  draw();

  document.addEventListener('keydown', function k(e) {
    if (!document.getElementById('mlb')) return document.removeEventListener('keydown', k);
    if (lb.classList.contains('hidden')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') showItem(cur - 1);
    if (e.key === 'ArrowRight') showItem(cur + 1);
  });
}

/* ---------- Router ---------- */
function route() {
  clearInterval(timer);
  window.scrollTo(0, 0);
  const h = location.hash || '#/';
  if (h === '#/roster') renderRoster();
  else if (h === '#/schedule') renderSchedule();
  else if (h === '#/standings') renderStandings();
  else if (h === '#/achievements') renderAchievements();
  else if (h === '#/gallery') renderGallery();
  else if (h === '#/merch') renderMerch();
  else renderHome();
}
window.addEventListener('hashchange', route);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
route();
</script>
</body>
</html>
